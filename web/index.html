<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="A new Flutter project.">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="tenawise">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>tenawise</title>
  <link rel="manifest" href="manifest.json">

  <!-- Interactive Favicon Animation on Load & Focus -->
  <script>
    (function() {
      var favicon = document.querySelector("link[rel*='icon']");
      if (!favicon) {
        favicon = document.createElement('link');
        favicon.type = 'image/png';
        favicon.rel = 'icon';
        document.head.appendChild(favicon);
      }
      var canvas = document.createElement('canvas');
      canvas.width = 64;
      canvas.height = 64;
      var ctx = canvas.getContext('2d');
      var img = new Image();
      img.src = 'favicon.png';

      var frame = 0;
      var animating = false;

      function animateFavicon() {
        if (!animating) return;
        frame++;
        ctx.clearRect(0, 0, 64, 64);
        var scale = 0.88 + 0.12 * Math.sin(frame * 0.25);
        ctx.save();
        ctx.beginPath();
        ctx.arc(32, 32, 28 * scale, 0, Math.PI * 2);
        ctx.fillStyle = 'rgba(1, 117, 194, 0.25)';
        ctx.fill();

        ctx.translate(32, 32);
        ctx.scale(scale, scale);
        ctx.drawImage(img, -24, -24, 48, 48);
        ctx.restore();

        favicon.href = canvas.toDataURL('image/png');

        if (frame < 36) {
          requestAnimationFrame(animateFavicon);
        } else {
          animating = false;
          favicon.href = 'favicon.png';
        }
      }

      function triggerAnimation() {
        frame = 0;
        if (!animating) {
          animating = true;
          animateFavicon();
        }
      }

      img.onload = function() {
        triggerAnimation();
      };
      window.addEventListener('focus', triggerAnimation);
      document.addEventListener('visibilitychange', function() {
        if (document.visibilityState === 'visible') {
          triggerAnimation();
        }
      });
    })();
  </script>
</head>
<body>
  <!--
    You can customize the "flutter_bootstrap.js" script.
    This is useful to provide a custom configuration to the Flutter loader
    or to give the user feedback during the initialization process.

    For more details:
    * https://docs.flutter.dev/platform-integration/web/initialization
  -->
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
